<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" fill="none" role="img" aria-label="VETOR MASTER — DIREÇÃO · CONEXÃO · CRESCIMENTO">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;family=Inter:wght@600;700;800&amp;display=swap');
      .vm-wordmark {
        font-family: 'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        font-size: 33px;
        fill: #3c3c3c;
        letter-spacing: 0.15em;
      }
      .vm-tagline {
        font-family: 'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        font-size: 8.8px;
        fill: #3c3c3c;
        letter-spacing: 0.22em;
        opacity: 0.95;
      }
    </style>
  </defs>

  <!-- ========================================================
       SÍMBOLO VETOR MASTER (ESQUERDA)
       Ícone vetorial limpo com geometria nativa exata:
       - Nós hexagonais conectados em 3 planos tridimensionais
       - Seta de crescimento e aceleração
       Cores Oficiais Exatas:
       * Verde:          #18ac2e (Crescimento)
       * Azul:           #0358ab (Direção)
       * Azul-Petróleo:  #07868f (Conexão)
       * Wordmark/Texto: #3c3c3c
       ======================================================== -->

  <!-- GRUPO DO ÍCONE (x: 6 a 112, y: 6 a 94) -->
  <g id="vm-icon">
    <!-- ==========================================
         CAMADA 1: AZUL #0358ab (DIREÇÃO / BASE ESTRATÉGICA)
         Nós e arestas hexagonais do cluster esquerdo
         ========================================== -->
    <g id="vm-nodes-blue">
      <!-- Linhas estruturais do hexágono azul -->
      <line x1="28" y1="42" x2="48" y2="30" stroke="#0358ab" stroke-width="2.6" stroke-linecap="round" />
      <line x1="48" y1="30" x2="68" y2="42" stroke="#0358ab" stroke-width="2.6" stroke-linecap="round" />
      <line x1="68" y1="42" x2="68" y2="66" stroke="#0358ab" stroke-width="2.6" stroke-linecap="round" />
      <line x1="68" y1="66" x2="48" y2="78" stroke="#0358ab" stroke-width="2.6" stroke-linecap="round" />
      <line x1="48" y1="78" x2="28" y2="66" stroke="#0358ab" stroke-width="2.6" stroke-linecap="round" />
      <line x1="28" y1="66" x2="28" y2="42" stroke="#0358ab" stroke-width="2.6" stroke-linecap="round" />

      <!-- Feixes internos / conexões axiais -->
      <line x1="48" y1="30" x2="48" y2="54" stroke="#0358ab" stroke-width="2.2" stroke-linecap="round" />
      <line x1="28" y1="66" x2="48" y2="54" stroke="#0358ab" stroke-width="2.2" stroke-linecap="round" />
      <line x1="68" y1="66" x2="48" y2="54" stroke="#0358ab" stroke-width="2.2" stroke-linecap="round" />
      <line x1="48" y1="54" x2="48" y2="78" stroke="#0358ab" stroke-width="2.2" stroke-linecap="round" />

      <!-- Satélites laterais da base azul -->
      <line x1="28" y1="42" x2="12" y2="51" stroke="#0358ab" stroke-width="2.2" stroke-linecap="round" />
      <line x1="12" y1="51" x2="12" y2="67" stroke="#0358ab" stroke-width="2.2" stroke-linecap="round" />
      <line x1="12" y1="67" x2="28" y2="76" stroke="#0358ab" stroke-width="2.2" stroke-linecap="round" />
      <line x1="28" y1="76" x2="28" y2="66" stroke="#0358ab" stroke-width="2.2" stroke-linecap="round" />

      <!-- Círculos dos nós azuis -->
      <circle cx="28" cy="42" r="4.2" fill="#0358ab" stroke="#ffffff" stroke-width="1.6" />
      <circle cx="48" cy="30" r="4.2" fill="#0358ab" stroke="#ffffff" stroke-width="1.6" />
      <circle cx="68" cy="42" r="4.2" fill="#0358ab" stroke="#ffffff" stroke-width="1.6" />
      <circle cx="68" cy="66" r="4.2" fill="#0358ab" stroke="#ffffff" stroke-width="1.6" />
      <circle cx="48" cy="78" r="4.2" fill="#0358ab" stroke="#ffffff" stroke-width="1.6" />
      <circle cx="28" cy="66" r="4.2" fill="#0358ab" stroke="#ffffff" stroke-width="1.6" />
      <circle cx="48" cy="54" r="4.0" fill="#0358ab" stroke="#ffffff" stroke-width="1.6" />
      <circle cx="12" cy="51" r="3.4" fill="#0358ab" stroke="#ffffff" stroke-width="1.4" />
      <circle cx="12" cy="67" r="3.4" fill="#0358ab" stroke="#ffffff" stroke-width="1.4" />
      <circle cx="28" cy="76" r="3.4" fill="#0358ab" stroke="#ffffff" stroke-width="1.4" />
    </g>

    <!-- ==========================================
         CAMADA 2: AZUL-PETRÓLEO #07868f (CONEXÃO)
         Nós intermediários e conectores tridimensionais
         ========================================== -->
    <g id="vm-nodes-teal">
      <!-- Linhas do cluster central / de transição -->
      <line x1="48" y1="30" x2="68" y2="18" stroke="#07868f" stroke-width="2.6" stroke-linecap="round" />
      <line x1="68" y1="18" x2="88" y2="30" stroke="#07868f" stroke-width="2.6" stroke-linecap="round" />
      <line x1="88" y1="30" x2="88" y2="54" stroke="#07868f" stroke-width="2.6" stroke-linecap="round" />
      <line x1="88" y1="54" x2="68" y2="66" stroke="#07868f" stroke-width="2.6" stroke-linecap="round" />
      <line x1="68" y1="18" x2="68" y2="42" stroke="#07868f" stroke-width="2.4" stroke-linecap="round" />
      <line x1="68" y1="42" x2="88" y2="54" stroke="#07868f" stroke-width="2.4" stroke-linecap="round" />

      <!-- Linhas superiores em direção ao ápice -->
      <line x1="68" y1="18" x2="68" y2="8" stroke="#07868f" stroke-width="2.2" stroke-linecap="round" />
      <line x1="68" y1="8" x2="86" y2="16" stroke="#07868f" stroke-width="2.2" stroke-linecap="round" />
      <line x1="86" y1="16" x2="88" y2="30" stroke="#07868f" stroke-width="2.2" stroke-linecap="round" />

      <!-- Círculos dos nós azul-petróleo -->
      <circle cx="68" cy="18" r="4.2" fill="#07868f" stroke="#ffffff" stroke-width="1.6" />
      <circle cx="88" cy="30" r="4.2" fill="#07868f" stroke="#ffffff" stroke-width="1.6" />
      <circle cx="88" cy="54" r="4.2" fill="#07868f" stroke="#ffffff" stroke-width="1.6" />
      <circle cx="68" cy="8" r="3.5" fill="#07868f" stroke="#ffffff" stroke-width="1.4" />
      <circle cx="86" cy="16" r="3.8" fill="#07868f" stroke="#ffffff" stroke-width="1.4" />
    </g>

    <!-- ==========================================
         CAMADA 3: VERDE #18ac2e (CRESCIMENTO / SETA EXPONENCIAL)
         Vetor ascendente dinâmico com nós de propulsão
         ========================================== -->
    <g id="vm-growth-green">
      <!-- Conexões de suporte inferior da seta -->
      <line x1="48" y1="78" x2="68" y2="90" stroke="#18ac2e" stroke-width="2.6" stroke-linecap="round" />
      <line x1="68" y1="90" x2="88" y2="78" stroke="#18ac2e" stroke-width="2.6" stroke-linecap="round" />
      <line x1="88" y1="78" x2="88" y2="54" stroke="#18ac2e" stroke-width="2.6" stroke-linecap="round" />
      <line x1="88" y1="78" x2="106" y2="67" stroke="#18ac2e" stroke-width="2.6" stroke-linecap="round" />
      <line x1="106" y1="67" x2="106" y2="45" stroke="#18ac2e" stroke-width="2.6" stroke-linecap="round" />

      <!-- Traço ascendente de vetor com espessura dinâmica -->
      <path
        d="M66 84 L88 42 L80 42 L97 12 L106 38 L97 38 L78 84 Z"
        fill="#18ac2e"
      />

      <!-- Grande Seta Vetorial Superior apontando para Nordeste (Crescimento/Futuro) -->
      <path
        d="M84 26 L112 6 L108 34 L101 27 L86 48 L79 43 L94 22 Z"
        fill="#18ac2e"
      />

      <!-- Nós de ancoragem verdes -->
      <circle cx="68" cy="90" r="4.2" fill="#18ac2e" stroke="#ffffff" stroke-width="1.6" />
      <circle cx="88" cy="78" r="4.2" fill="#18ac2e" stroke="#ffffff" stroke-width="1.6" />
      <circle cx="106" cy="67" r="4.2" fill="#18ac2e" stroke="#ffffff" stroke-width="1.6" />
      <circle cx="106" cy="45" r="3.8" fill="#18ac2e" stroke="#ffffff" stroke-width="1.4" />
      <circle cx="112" cy="6" r="2.8" fill="#18ac2e" />
    </g>
  </g>

  <!-- ========================================================
       WORDMARK "VETOR MASTER" & TAGLINE
       Tipografia nativa em texto vetorial limpo:
       - Cor #3c3c3c exata da marca
       - Fundo 100% transparente (sem retângulo embutido)
       - Proporção harmônica ao lado do ícone geométrico
       ======================================================== -->
  <g id="vm-text">
    <!-- WORDMARK: VETOR MASTER -->
    <text x="132" y="52" class="vm-wordmark">VETOR MASTER</text>

    <!-- TAGLINE: DIREÇÃO · CONEXÃO · CRESCIMENTO -->
    <text x="133" y="74" class="vm-tagline">DIREÇÃO · CONEXÃO · CRESCIMENTO</text>
  </g>
</svg>
